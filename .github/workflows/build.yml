name: Build Android DevContainer + Emulator

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry (if needed)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          files: |
            ./docker-bake.hcl
            ./docker-bake.gha.hcl
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.platform=linux/amd64
            android-devcontainer.output=type=registry
            android-emulator.output=type=registry
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/
          TAG: ${{ github.ref_name }}
            
      # - name: Test container
      #   run: |
      #     docker run --rm android-devcontainer:${{ github.ref_name }} /usr/local/bin/healthcheck.sh
