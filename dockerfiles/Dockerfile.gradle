# Gradle stage
FROM base-image
ARG GRADLE_VERSION=8.10.2

RUN apt-get update && apt-get install -y unzip && rm -rf /var/lib/apt/lists/*

# Use cache mount and check if gradle is already downloaded
RUN --mount=type=cache,target=/var/cache/gradle \
    if [ ! -f /var/cache/gradle/gradle-${GRADLE_VERSION}-bin.zip ]; then \
        curl -fsSL -o /var/cache/gradle/gradle-${GRADLE_VERSION}-bin.zip \
            https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip; \
    fi && \
    unzip /var/cache/gradle/gradle-${GRADLE_VERSION}-bin.zip -d /opt && \
    mv /opt/gradle-${GRADLE_VERSION} /opt/gradle && \
    ln -s /opt/gradle/bin/gradle /usr/local/bin/gradle

